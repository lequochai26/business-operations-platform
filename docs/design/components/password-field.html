<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>PasswordField – gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ui-tokens.css">
  <script src="password-field.js"></script>
  <style>
    body { margin: 0; padding: var(--space-xl); background: var(--color-surface-page); font-family: var(--font-family-body); color: var(--color-text-default); }
    h1 { font-size: var(--font-size-xl); margin: 0 0 var(--space-lg); }
    .grid { display: grid; grid-template-columns: calc(var(--space-xxxl) * 5) calc(var(--space-xxxl) * 7); gap: var(--space-lg) var(--space-xl); align-items: center; }
    .label { font-size: var(--font-size-sm); color: var(--color-text-muted); }
  </style>
</head>
<body>
  <h1>PasswordField</h1>
  <div class="grid">
    <span class="label">bình thường, trống</span>
    <mio-password-field label="Mật khẩu"></mio-password-field>

    <span class="label">có giá trị, đang ẩn</span>
    <mio-password-field label="Mật khẩu" value="hoa-cuc-2026"></mio-password-field>

    <span class="label">revealed (đang hiện ký tự)</span>
    <mio-password-field label="Mật khẩu" value="hoa-cuc-2026" revealed></mio-password-field>

    <span class="label">có gợi ý</span>
    <mio-password-field label="Mật khẩu mới" hint="Ít nhất 8 ký tự" autocomplete="new-password"></mio-password-field>

    <span class="label">state=hover</span>
    <mio-password-field label="Mật khẩu" value="hoa-cuc-2026" state="hover"></mio-password-field>

    <span class="label">state=focus</span>
    <mio-password-field label="Mật khẩu" value="hoa-cuc-2026" state="focus"></mio-password-field>

    <span class="label">lỗi (thay chỗ gợi ý)</span>
    <mio-password-field label="Mật khẩu mới" value="mio123" hint="Ít nhất 8 ký tự" error="Mật khẩu mới phải từ 8 đến 128 ký tự" autocomplete="new-password"></mio-password-field>

    <span class="label">lỗi, revealed</span>
    <mio-password-field label="Nhập lại mật khẩu mới" value="hoa-cuc-2027" error="Mật khẩu nhập lại không khớp" revealed autocomplete="new-password"></mio-password-field>

    <span class="label">state=disabled</span>
    <mio-password-field label="Mật khẩu" value="hoa-cuc-2026" state="disabled"></mio-password-field>
  </div>
</body>
</html>
