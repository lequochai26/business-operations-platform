<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <!-- Mockup Đăng nhập – trạng thái mất kết nối. Khung chuẩn 1440×900. Sinh bởi /ui-design auth. -->
  <title>Đăng nhập – mất kết nối</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../ui-tokens.css">
  <link rel="stylesheet" href="../mockup-base.css">
  <script src="../../components/password-field.js"></script>
  <style>
    .login { min-height: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--space-xl); }
    .login-logo { font-family: var(--font-family-decorative); font-size: var(--font-size-logo); font-weight: var(--font-weight-semibold); color: var(--color-brand-primary-strong); line-height: 1; }
    .login-sub { font-size: var(--font-size-sm); color: var(--color-text-muted); margin: var(--space-xs) 0 var(--space-xl); }
    .login .card { width: calc(var(--space-xxxl) * 8); padding: var(--space-xxl); }
    .login .page-title { margin-bottom: var(--space-xl); }
    .login .form { gap: var(--space-lg); }
    .login .forgot { font-size: var(--font-size-sm); color: var(--color-text-muted); text-align: center; margin-top: var(--space-lg); }
  </style>
</head>
<body>
  <div class="login">
    <div class="login-logo">Mio</div>
    <div class="login-sub">Tiệm Nhà Mio · vận hành</div>
    <div class="card">
      <h1 class="page-title">Đăng nhập</h1>
      <form class="form" novalidate>
        <label class="field">Tên đăng nhập<input class="input" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" value="mio"></label>
        <mio-password-field label="Mật khẩu" name="password" autocomplete="current-password" value="hoa-cuc-2026"></mio-password-field>
        <div class="alert alert-danger" role="alert">Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.</div>
        <button class="btn btn-primary btn-block" type="submit">Đăng nhập</button>
      </form>
      <p class="forgot">Quên mật khẩu? Nhờ người quản trị app đặt lại.</p>
    </div>
  </div>
</body>
</html>
